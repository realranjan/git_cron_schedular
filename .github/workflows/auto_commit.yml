name: Auto Commit Cron Scheduler

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI tab

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Auto-Commit Script
        env:
          COMMIT_MODE: 'realistic'
          CONTENT_TYPE: 'hybrid'
          MIN_COMMITS: '1'
          MAX_COMMITS: '4'
          SKIP_CHANCE: '0.15'
        run: node scripts/auto_commit.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add solutions/ notes/ data/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "feat(sync): daily activity & study update [skip ci]"
          git push origin main
